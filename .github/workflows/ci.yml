name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm git nodejs python imagemagick chromium ttf-dejavu qt6-declarative qt6-imageformats qt6-multimedia pulseaudio
      - name: Start a silent audio server for Qt Multimedia
        run: pulseaudio --daemonize --exit-idle-time=-1 --load=module-null-sink
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (Quickshell and omarchy validate skip outside a desktop)
        env:
          QT_QPA_PLATFORM: offscreen
        run: node --test --test-concurrency=1 'tests/*.test.js'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-output
          path: tests/out
          if-no-files-found: ignore

  title:
    name: title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'; then
            echo "::error title=PR title::Rename the PR as <type>(optional-scope): <description>, like 'fix: keep the ember glow at 2x scale'. Types are in CONTRIBUTING.md."
            exit 1
          fi
